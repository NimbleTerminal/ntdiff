version: '3'

env:
  GOWORK: 'off'

tasks:
  default:
    desc: 'Default task runs the "test" and "build" tasks'
    deps:
      - test
      - build

  list:
    desc: 'Lists available tasks'
    cmds:
      - task --list-all

###############################################################################

  go-tidy:
    desc: 'Go tidy all the things'
    run: once
    cmds:
      - go mod tidy
      - go -C examples mod tidy

  go-update:
    desc: 'Go update all the dependencies'
    run: once
    cmds:
      - go get -u ./...
      - go -C examples get -u ./... tool
      - task: go-tidy

  test:
    desc: 'Run all Go tests'
    cmds:
      - go test ./...
      - go -C examples test ./...

  build:
    desc: 'Build the ntdiff binary'
    deps:
      - go-tidy
    cmds:
      - go build -o bin/ntdiff ./cmd/ntdiff
    sources:
      - diff/**/*.go
      - cmd/ntdiff/*.go
      - go.mod
      - go.sum
    generates:
      - bin/ntdiff

  clean:
    desc: 'Clean built targets'
    cmds:
      - rm -f bin/ntdiff
      - rm -rf .task

###############################################################################
# Demo website via booba

  run-demo:
    desc: 'Run the interactive terminal/typeset demo'
    cmds:
      - go -C examples run ./demo {{.CLI_ARGS}}

  build-wasm:
    desc: 'Build the demo with the pinned browser bridge'
    env:
      GOWORK: '{{.ROOT_DIR}}/wasm.work'
      GOOS: js
      GOARCH: wasm
      CGO_ENABLED: '0'
    cmds:
      - go -C examples build -mod=readonly -trimpath -ldflags='-s -w' -o ../web/app.wasm ./demo

  build-wasm-site:
    desc: 'Build the demo and export the pinned booba runtime'
    cmds:
      - task: build-wasm
      - go -C examples tool booba-assets --no-index ../web
      - task: check-site

  check-site:
    desc: 'Validate web assets and exercise the real WASM demo under Node'
    cmds:
      - node --check web/site.js
      - node scripts/check-site.mjs
      - node scripts/smoke-demo.mjs
      - node scripts/smoke-demo.mjs typeset

  serve-wasm-site:
    desc: 'Serve web/ at http://localhost:8000/ntdiff/ (matches GH Pages prefix)'
    deps: [build-wasm-site]
    vars:
      SERVE_DIR: /tmp/ntdiff-site
    cmds:
      - mkdir -p {{.SERVE_DIR}}
      - rm -f {{.SERVE_DIR}}/ntdiff
      - ln -sfn "$(pwd)/web" {{.SERVE_DIR}}/ntdiff
      - echo 'Serving at http://localhost:8000/ntdiff/'
      - cd {{.SERVE_DIR}} && python3 -m http.server 8000 --bind 127.0.0.1

  clean-wasm-site:
    desc: 'Remove WASM demo site artifacts'
    cmds:
      - rm -rf web/booba web/ghostty-web web/ntwebterm
      - rm -f web/wasm_exec.js
      - rm -f web/app.wasm
