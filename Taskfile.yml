version: '3'

env:
  GOWORK: 'off'

tasks:
  default:
    desc: 'Default task runs the "test" and "build" tasks'
    deps:
      - test
      - build

  list:
    desc: 'Lists available tasks'
    cmds:
      - task --list-all

###############################################################################

  go-tidy:
    desc: 'Go tidy all the things'
    run: once
    cmds:
      - go mod tidy
      - go -C examples mod tidy

  go-update:
    desc: 'Go update all the dependencies'
    run: once
    cmds:
      - go get -u ./...
      - go -C examples get -u ./... tool
      - task: go-tidy

  fmt-check:
    desc: 'Check Go formatting'
    cmds:
      - |
        unformatted_files=$(gofmt -l cmd diff typeset examples)
        if [ -n "$unformatted_files" ]; then
          printf '%s\n' "$unformatted_files"
          exit 1
        fi

  go-tidy-check:
    desc: 'Check both modules without changing their files'
    cmds:
      - go mod tidy -diff
      - go -C examples mod tidy -diff

  go-verify:
    desc: 'Verify dependency checksums in both modules'
    cmds:
      - go mod verify
      - go -C examples mod verify

  test-race:
    desc: 'Run tests in both modules with the race detector'
    cmds:
      - go test -mod=readonly -race ./...
      - go -C examples test -mod=readonly -race ./...

  vet:
    desc: 'Run go vet in both modules'
    cmds:
      - go vet -mod=readonly ./...
      - go -C examples vet -mod=readonly ./...

  fuzz:
    desc: 'Fuzz parsing, quoted paths, and token spans (10s per target by default)'
    vars:
      FUZZTIME: '{{default "10s" .FUZZTIME}}'
    cmds:
      - for: [FuzzParse, FuzzQuotedPaths, FuzzTokenSpans]
        cmd: go test -mod=readonly ./diff -run='^$' -fuzz='^{{.ITEM}}$' -fuzztime={{.FUZZTIME}} -parallel=2

  ci:
    desc: 'Check formatting, dependencies, race tests, fuzzing, vet, native builds, and the WASM demo'
    cmds:
      - task: fmt-check
      - task: go-tidy-check
      - task: go-verify
      - task: test-race
      - task: fuzz
      - task: vet
      - task: build
      - task: build-examples
      - task: build-wasm-site

  test:
    desc: 'Run all Go tests'
    cmds:
      - go test ./...
      - go -C examples test ./...

  build:
    desc: 'Build the ntdiff binary'
    cmds:
      - go build -mod=readonly -o bin/ntdiff ./cmd/ntdiff
    sources:
      - diff/**/*.go
      - cmd/ntdiff/*.go
      - go.mod
      - go.sum
    generates:
      - bin/ntdiff

  build-examples:
    desc: 'Build all native examples'
    cmds:
      - go -C examples build -mod=readonly -o ../bin/ntdiff-demo ./demo

  clean:
    desc: 'Clean built targets'
    cmds:
      - rm -f bin/ntdiff bin/ntdiff-demo
      - rm -rf .task

###############################################################################
# Demo website via booba

  run-demo:
    desc: 'Run the interactive terminal/typeset demo'
    cmds:
      - go -C examples run ./demo {{.CLI_ARGS}}

  build-wasm:
    desc: 'Build the demo with the pinned browser bridge'
    env:
      GOWORK: '{{.ROOT_DIR}}/wasm.work'
      GOOS: js
      GOARCH: wasm
      CGO_ENABLED: '0'
    cmds:
      - go -C examples build -mod=readonly -trimpath -ldflags='-s -w' -o ../web/app.wasm ./demo

  build-wasm-site:
    desc: 'Build the demo and export the pinned booba runtime'
    cmds:
      - task: build-wasm
      - go -C examples tool booba-assets --no-index ../web
      - task: check-site

  check-site:
    desc: 'Validate web assets and exercise the real WASM demo under Node'
    cmds:
      - node --check web/site.js
      - node scripts/check-site.mjs
      - node scripts/smoke-demo.mjs
      - node scripts/smoke-demo.mjs typeset

  serve-wasm-site:
    desc: 'Serve web/ at http://localhost:8000/ntdiff/ (matches GH Pages prefix)'
    deps: [build-wasm-site]
    vars:
      SERVE_DIR: /tmp/ntdiff-site
    cmds:
      - mkdir -p {{.SERVE_DIR}}
      - rm -f {{.SERVE_DIR}}/ntdiff
      - ln -sfn "$(pwd)/web" {{.SERVE_DIR}}/ntdiff
      - echo 'Serving at http://localhost:8000/ntdiff/'
      - cd {{.SERVE_DIR}} && python3 -m http.server 8000 --bind 127.0.0.1

  clean-wasm-site:
    desc: 'Remove WASM demo site artifacts'
    cmds:
      - rm -rf web/booba web/ghostty-web web/ntwebterm
      - rm -f web/wasm_exec.js
      - rm -f web/app.wasm
