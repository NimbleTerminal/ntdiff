name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: examples/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test library and demo
        run: |
          go test -mod=readonly ./...
          go -C examples test -mod=readonly ./...
      - name: Build WASM demo
        run: GOWORK="$PWD/wasm.work" GOOS=js GOARCH=wasm CGO_ENABLED=0 go -C examples build -mod=readonly -trimpath -ldflags='-s -w' -o ../web/app.wasm ./demo
      - name: Export runtime and check demo
        run: |
          go -C examples tool booba-assets --no-index ../web
          node --check web/site.js
          node scripts/check-site.mjs
          node scripts/smoke-demo.mjs
          node scripts/smoke-demo.mjs typeset
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
